{% extends "base.html" %}

{% block title %}Register New Account - DeepShield AI{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-custom p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="logo-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem; border-radius: 12px; background: linear-gradient(135deg, var(--accent-sky), var(--accent-blue)); display: flex; align-items: center; justify-content: center; color: white;">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold">Create Account</h3>
                    <p class="text-secondary small">
                        Join DeepShield AI to analyze videos and view detection metrics
                    </p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-card-text"></i></span>
                            <input type="text" name="full_name" class="form-control border-start-0" placeholder="e.g. John Doe" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control border-start-0" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control border-start-0" placeholder="name@domain.com" required>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" name="password" class="form-control border-start-0" placeholder="Min. 6 chars" minlength="6" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-check2-circle"></i></span>
                                <input type="password" name="confirm_password" class="form-control border-start-0" placeholder="Repeat password" minlength="6" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2 mt-2">
                        <i class="bi bi-person-check-fill me-1"></i> Register Account
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-secondary mb-0">
                        Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-primary text-decoration-none">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
