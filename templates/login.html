
<!DOCTYPE html>
<html>
<head>
    <title>Deepfake Detection - Login</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #101b35, #263c62);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
        }
        h2 { color: #182b4d; }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #174ea6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Deepfake Detection</h2>
        <p>Login to your account</p>
        <form method="POST">
            <input type="text" name="username"
                   placeholder="Username" required>
            <input type="password" name="password"
                   placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
